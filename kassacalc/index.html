<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex">
        <div id="form">
            <label>
                <span>Касса</span>
                <input class="input" type="number" id="kassa">
            </label>
            <label>
                <span>Безнал</span>
                <input class="input" type="number" id="beznal">
                <button id="beznal-btn">Расчитать</button>
            </label>
            <label>
                <span>Нал</span>
                <input class="input" type="number" id="nal">
                <button id="nal-btn">Расчитать</button>
            </label>
            <label>
                <span>Долг</span>
                <input class="input" type="number" id="dolg">
            </label>
            <label>
                <span>Банк Безнал</span>
                <input class="input" type="number" id="bank-beznal">
            </label>
            <label>
                <span>Банк Нал</span>
                <input class="input" type="number" id="bank-nal">
            </label>
            <button id="procent-btn">%</button>
            <button id="update-btn">Расчитать</button>
            <button id="save-btn">Сохранить</button>
            <button id="clear-btn">Очистить историю</button>
            <div id="result"></div>
        </div>
        <div id="data-screen"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
